name: Native

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # native-image compiles and links with MSVC on Windows.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true
          install: true

      # Default shell on purpose: under Git Bash, its link.exe shadows MSVC's.
      - name: Build native executable
        run: mise run native

      # Not `mise run package`: its native dependency would rerun Gradle under Git Bash.
      - name: Package
        shell: bash
        run: |
          scripts/package.sh
          test -f "dist/dprint-plugin-ktfmt-$TARGET.zip"
        env:
          TARGET: ${{ matrix.target }}

      - name: Integration tests
        if: runner.os != 'Windows'
        run: bats tests

      - name: Parity with the ktfmt CLI on okhttp
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/parity-okhttp.sh

      - name: Smoke test
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/smoke.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dprint-plugin-ktfmt-${{ matrix.target }}
          path: dist/dprint-plugin-ktfmt-${{ matrix.target }}.zip
          if-no-files-found: error
