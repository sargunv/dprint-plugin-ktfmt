[settings]
experimental = true
pin = true
minimum_release_age = "3d"
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
"aqua:dprint/dprint" = "0.63.0"
"aqua:jdx/hk" = "2.6.0"
# GraalVM CE: the JDK for Gradle and the native-image compiler for release builds. An Innovation
# release, as ktfmt's own native binary uses: unlike 25.0.x CE, they build with compressed
# references, which roughly halve the serial GC's work on large runs.
"core:java" = "graalvm-community-innovation-25.0.4.1.1"
"aqua:facebook/ktfmt" = "0.65"
"aqua:koalaman/shellcheck" = "0.11.0"
# No Windows build; CI smoke-tests the plugin there instead.
"aqua:bats-core/bats-core" = { version = "1.14.0", os = ["linux", "macos"] }
"aqua:rhysd/actionlint" = "1.7.12"

[tasks.check]
description = "Run every formatter and linter in report-only mode."
run = "hk check --all"

[tasks.fix]
description = "Apply every formatter and auto-fixable lint."
run = "hk fix --all"

[tasks.build]
description = "Build the JVM plugin and run unit tests."
run = "./gradlew build"
run_windows = "gradlew.bat build"

[tasks.native]
description = "Compile the native executable with GraalVM native-image."
run = "./gradlew nativeCompile"
run_windows = "gradlew.bat nativeCompile"

[tasks.package]
description = "Zip the native executable into dist/ for the host platform."
depends = ["native"]
# Needs bash on Windows too (Git Bash).
shell = "bash -c"
run = "scripts/package.sh"

[tasks."test:integration"]
description = "Run the bats integration tests against the packaged plugin."
depends = ["package"]
run = "bats tests"

[tasks.parity]
description = "Diff plugin output against the ktfmt CLI on a corpus: mise run parity <dir> [style]."
depends = ["package"]
shell = "bash -c"
run = "scripts/parity.sh"

[tasks."parity:okhttp"]
description = "Run parity in every style on okhttp at a pinned commit."
depends = ["package"]
shell = "bash -c"
run = "scripts/parity-okhttp.sh"

[tasks.verify]
description = "Run checks, unit tests, the native build, and integration tests."
# Sequential: concurrent Gradle runs in one project contend for build/.
run = ["mise run check", "mise run build", "mise run test:integration"]

[tasks._ktfmt]
hide = true
# Keep the JVM quiet on stdout: dprint exec reads it as the formatted file.
run = 'java -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:-UsePerfData -Xlog:disable -Xlog:all=warning:stderr -jar {{ tools["aqua:facebook/ktfmt"].path }}/ktfmt'

[hooks]
postinstall = ["hk install --mise"]
